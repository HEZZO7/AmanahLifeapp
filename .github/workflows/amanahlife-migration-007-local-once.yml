# REVIEW ONLY: installation and ONE execution need separate explicit approval.
# Before installation: confirm zero history for THIS new filename; approve run_number=1.
# Android, only after installation AND separate execution authorization:
# GitHub > HEZZO7/AmanahLifeapp > Actions > AmanahLife Migration 007 local - once
# > Run workflow > main > approve_migration_007=true > Run workflow ONCE.
# Never use Re-run jobs. Inspect the final gate and safe job summary in that run.
# No artifacts/raw logs are uploaded. This does not authorize production rollout.
name: AmanahLife Migration 007 local - once

on:
  workflow_dispatch:
    inputs:
      approve_migration_007:
        description: 'Approve ONE disposable local Migration 007 test; no production'
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: amanahlife-migration-007-local-once
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      SOURCE_DIR: ${{ github.workspace }}/subject
      TEST_DIR: ${{ github.workspace }}/package/app/frontend/tests/notification-007-local
      AMANAHLIFE_LOCAL_007_APPROVAL: two-synthetic-users-only
      SUPABASE_ACCESS_TOKEN: ''
      SUPABASE_PROJECT_REF: ''
      SUPABASE_DB_PASSWORD: ''
      DO_NOT_TRACK: '1'
      DOCKER_HOST: unix:///var/run/docker.sock
    steps:
      - name: Require exactly the approved first manual attempt
        id: authorize
        env:
          APPROVAL: ${{ inputs.approve_migration_007 }}
          PRIVATE: ${{ toJSON(github.event.repository.private) }}
        run: |
          set -euo pipefail
          umask 077
          if [ "$GITHUB_EVENT_NAME" != workflow_dispatch ] ||
             [ "$GITHUB_REPOSITORY" != HEZZO7/AmanahLifeapp ] ||
             [ "$PRIVATE" != false ] || [ "$GITHUB_REF" != refs/heads/main ] ||
             [ "$APPROVAL" != true ] || [ "$GITHUB_RUN_NUMBER" != 1 ] ||
             [ "$GITHUB_RUN_ATTEMPT" != 1 ] ||
             [ "$RUNNER_ENVIRONMENT" != github-hosted ]; then
            echo 'FAIL: manual authorization rejected'
            exit 1
          fi
          test "$(uname -m)" = x86_64
          suffix="$(openssl rand -hex 4)"
          {
            printf 'SMOKE_ROOT=%s/amanah-007-%s-%s\n' "$RUNNER_TEMP" "$GITHUB_RUN_ID" "$suffix"
            printf 'CLI_ARCHIVE=%s/supabase_2.121.0_linux_amd64.tar.gz\n' "$RUNNER_TEMP"
            for item in RESULT_LOG CLEANUP_LOG PRIVATE_LOG PACKAGE_CHECKSUMS; do
              printf '%s=%s/amanah-007-%s-%s\n' "$item" "$RUNNER_TEMP" "$GITHUB_RUN_ID" "$item"
            done
          } >> "$GITHUB_ENV"
          echo 'PASS: first manual attempt authorized'

      - name: Check out immutable application sources
        id: app
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: HEZZO7/AmanahLifeapp
          ref: 3968fa6795bab794e72596d23d87c6b388659098
          path: subject
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /app/frontend/package.json
            /ci/notification-local/setup.sql
            /app/frontend/supabase/migrations/202610180007_notification_table_authority.sql
            /app/frontend/src/lib/notificationPreferenceWrite.ts
            /app/frontend/src/lib/notificationBackup.ts
            /app/frontend/src/lib/notificationPreferenceClient.ts
            /app/frontend/tests/preference-test-loader.mjs

      - name: Check out immutable integration package
        id: package
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: HEZZO7/AmanahLifeapp
          ref: 497add8ef047ac6770c6d728febf15e7ee61680f
          path: package
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /app/frontend/tests/notification-007-local/

      - name: Use the pinned compatible Node runtime
        id: node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.23.3
          check-latest: false

      - name: Verify executable inputs and prepare only locked public dependencies
        id: prepare
        timeout-minutes: 6
        run: |
          set -euo pipefail
          umask 077
          test "$(node --version)" = v22.23.3
          test "$(npm --version)" = 10.9.9
          test "$(git -C "$SOURCE_DIR" rev-parse HEAD)" = 3968fa6795bab794e72596d23d87c6b388659098
          test "$(git -C "$GITHUB_WORKSPACE/package" rev-parse HEAD)" = 497add8ef047ac6770c6d728febf15e7ee61680f
          test ! -e "$SMOKE_ROOT"
          test ! -e "$CLI_ARCHIVE"
          cd "$TEST_DIR"
          cat > "$PACKAGE_CHECKSUMS" <<'SHA256'
          4690f27c4f327f0b7c617a608efe8fc835df14555b4c9aef01d153b8015f7db9  README.md
          2679727bbbdf7d7a9925a2152be5d1434028914b2c6830cc93c0a7ad2fa2a687  integration.mjs
          8a3f02b1884442243fd4a76cfd93e41a2ff50929f4c4a5fa22f518688278f3e5  local-safety.mjs
          2caf12ce86137a5dbbf494fdcb24002e9de3e973584bd7708614db2fb9df785f  package-lock.json
          48671699759cdac50a775d00a4da1b44f933e18babb88eec260f7e39849a91f9  package.json
          5af25071f54c2ec9cee9a905e0f4aae8ef11c2206256c33ebcfa31b1f85f2d67  review.test.mjs
          9a019c8c5952c22d8760d1865aa952ee155792b25e780f02e8a82921833d8f29  source-manifest.json
          SHA256
          sha256sum --check --strict "$PACKAGE_CHECKSUMS" > "$PRIVATE_LOG" 2>&1
          # Verify the loader BEFORE Node can execute it; do not install app dependencies.
          python3 -I - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root = Path(os.environ['SOURCE_DIR']).resolve()
          manifest = json.loads((Path(os.environ['TEST_DIR']) / 'source-manifest.json').read_text())
          assert manifest['sourceCommit'] == '3968fa6795bab794e72596d23d87c6b388659098'
          files = dict(manifest['files'])
          files['app/frontend/package.json'] = '644095a6e862ce88a0556337dfec82412b83b093'
          assert len(files) == 7
          for name, expected in files.items():
              target = root / name
              assert target.resolve() == target and not target.is_symlink()
              data = target.read_bytes()
              assert hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest() == expected
          PY
          echo 'package_verified=true' >> "$GITHUB_OUTPUT"
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
            --connect-timeout 20 --max-time 180 \
            https://github.com/supabase/cli/releases/download/v2.121.0/supabase_2.121.0_linux_amd64.tar.gz \
            -o "$CLI_ARCHIVE" >> "$PRIVATE_LOG" 2>&1
          printf '%s  %s\n' 4b481189efbdc57cf2d37bdee5f1a0d29574314398564b32a6dfb76c0fcf275f "$CLI_ARCHIVE" |
            sha256sum --check --strict >> "$PRIVATE_LOG" 2>&1
          npm ci --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org \
            >> "$PRIVATE_LOG" 2>&1
          echo 'PASS: source/package hashes, CLI archive, Node/npm and locked dependencies verified'

      - name: Execute only the reviewed isolated integration entrypoint
        id: integration
        timeout-minutes: 26
        run: |
          set -euo pipefail
          umask 077
          code=0
          node --experimental-strip-types \
            --loader "$SOURCE_DIR/app/frontend/tests/preference-test-loader.mjs" \
            "$TEST_DIR/integration.mjs" --source "$SOURCE_DIR" \
            --workdir "$SMOKE_ROOT" --cli-archive "$CLI_ARCHIVE" \
            > "$RESULT_LOG" 2>> "$PRIVATE_LOG" || code=$?
          printf 'Integration process exit=%s; raw output withheld\n' "$code"
          exit "$code"

      - name: Always clean up and independently verify disposable resources
        id: cleanup
        if: ${{ always() && steps.authorize.outcome == 'success' }}
        timeout-minutes: 5
        env:
          PACKAGE_VERIFIED: ${{ steps.prepare.outputs.package_verified }}
        run: |
          set -euo pipefail
          umask 077
          failed=0
          if [ "$PACKAGE_VERIFIED" = true ]; then
            if (cd "$TEST_DIR" && sha256sum --check --strict "$PACKAGE_CHECKSUMS") >> "$PRIVATE_LOG" 2>&1; then
              node "$TEST_DIR/integration.mjs" --cleanup --workdir "$SMOKE_ROOT" \
                > "$CLEANUP_LOG" 2>> "$PRIVATE_LOG" || failed=1
            else
              failed=1
            fi
          elif [ -e "$SMOKE_ROOT" ] || [ -L "$SMOKE_ROOT" ]; then
            failed=1
          fi
          project="${SMOKE_ROOT##*/}"
          for kind in container volume network; do
            if [ "$kind" = container ]; then
              remaining="$(docker ps -aq --filter "label=com.supabase.cli.project=$project" 2>> "$PRIVATE_LOG")" || failed=1
            else
              remaining="$(docker "$kind" ls -q --filter "label=com.supabase.cli.project=$project" 2>> "$PRIVATE_LOG")" || failed=1
            fi
            [ -z "$remaining" ] || failed=1
          done
          [ ! -e "$SMOKE_ROOT" ] && [ ! -L "$SMOKE_ROOT" ] || failed=1
          if [ "$failed" != 0 ]; then
            echo 'FAIL: required cleanup/resource verification incomplete'
            exit 1
          fi
          echo 'resources_verified=true' >> "$GITHUB_OUTPUT"
          echo 'PASS: disposable workdir and project resources absent'

      - name: Require all fourteen checks, successful steps and independent cleanup
        if: ${{ always() }}
        env:
          REQUIRED_OUTCOMES: >-
            ${{ steps.authorize.outcome }} ${{ steps.app.outcome }}
            ${{ steps.package.outcome }} ${{ steps.node.outcome }}
            ${{ steps.prepare.outcome }} ${{ steps.integration.outcome }}
            ${{ steps.cleanup.outcome }}
          CLEANUP_VERIFIED: ${{ steps.cleanup.outputs.resources_verified }}
        run: |
          set -euo pipefail
          python3 -I - <<'PY'
          import json, os, sys
          from pathlib import Path
          checks = ['auth','migration_first','migration_repeat','effective_acl','forged_auth',
                    'foreign_insert','first_insert_race','cross_account','column_denials',
                    'client_compatibility','session_switch','server_crud','sql_denials','preservation']
          def report(name):
              p = Path(os.environ[name])
              assert p.stat().st_size <= 262144
              return json.loads(p.read_text().splitlines()[-1])
          try:
              assert os.environ['REQUIRED_OUTCOMES'].split() == ['success'] * 7
              assert os.environ['CLEANUP_VERIFIED'] == 'true'
              result = report('RESULT_LOG')
              assert result == {
                  'mode':'integration','result':'passed','checks':checks,
                  'source':'3968fa6795bab794e72596d23d87c6b388659098',
                  'hostedVerified':False,'productionReady':False}
              assert result['hostedVerified'] is False and result['productionReady'] is False
              cleaned = report('CLEANUP_LOG')
              assert cleaned == {'mode':'cleanup','cleanupPassed':True} and cleaned['cleanupPassed'] is True
              message = 'PASS: 14/14 required local integration groups; independent cleanup verified. No production readiness claim.'
              print(message)
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
                  summary.write(message + '\n')
          except Exception:
              # Emit only fixed, allowlisted diagnostics; never print a raw report.
              try:
                  failure = report('RESULT_LOG')
                  phases = set(checks + ['preflight','init','start','status','fixture','dependencies','client_module','schema_ready','cleanup'])
                  categories = {'assertion_failed','timeout','command_failed','port_conflict','docker_unavailable',
                                'image_download','database_bootstrap','service_health','network','cleanup_failed',
                                'schema_not_ready','schema_cache_timeout','race_not_observed'}
                  if failure.get('result') == 'failed' and failure.get('phase') in phases and failure.get('category') in categories:
                      print('FAIL: phase=' + failure['phase'] + ' category=' + failure['category'])
              except Exception:
                  pass
              print('FAIL: required step, complete integration report or cleanup verification missing/invalid')
              sys.exit(1)
          finally:
              for name in ['RESULT_LOG','CLEANUP_LOG','PRIVATE_LOG','CLI_ARCHIVE','PACKAGE_CHECKSUMS']:
                  if os.environ.get(name):
                      Path(os.environ[name]).unlink(missing_ok=True)
          PY
