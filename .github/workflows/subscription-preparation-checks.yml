name: Subscription Preparation Checks

on:
  pull_request:
    branches:
      - fix/auth-subscription

permissions:
  contents: read

jobs:
  preparation-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Auth return tests
        run: node --experimental-strip-types tests/auth-return.test.mjs
      - name: Install dependencies
        run: npm install
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
