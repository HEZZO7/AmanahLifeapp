name: Import reviewed Axios
on:
  push:
    branches: [review/commercial-readiness-sprint-01]
    paths: ['.github/workflows/import-axios-reviewed.yml']
permissions:
  contents: write
  actions: read
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: review/commercial-readiness-sprint-01
      - uses: actions/download-artifact@v4
        with:
          name: axios-reviewed-candidate
          run-id: 43751680741
          github-token: ${{ github.token }}
          path: /tmp/axios-reviewed
      - run: |
          node -e 'const a=require("./app/frontend/package.json"), b=require("/tmp/axios-reviewed/package.json"); a.dependencies.axios="1.21.1"; require("node:assert").deepStrictEqual(a,b)'
          cp /tmp/axios-reviewed/package*.json app/frontend/
          git add app/frontend/package.json app/frontend/package-lock.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --cached --quiet || git commit -m "Adopt verified Axios 1.21.1 candidate"
          git push origin HEAD:refs/heads/review/commercial-readiness-sprint-01
