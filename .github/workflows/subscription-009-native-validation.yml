name: Subscription 009 - Phase 3 validation branch dispatcher

# Registered on main; dispatch this branch without changing main.
# No automatic triggers, environment secrets, or provider authorization.
on:
  workflow_dispatch:
    inputs:
      approve_disposable_run:
        description: 'Authorize the reviewed Phase3 001-011 native run and transactional synthetic SQL reservations; no provider calls'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  approved-phase3:
    uses: ./.github/workflows/amanahlife-payment-phase3-native.yml
    with:
      approve_disposable_run: ${{ inputs.approve_disposable_run }}
