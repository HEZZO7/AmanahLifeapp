<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      Google AdSense site verification. This file is the single base
      template every page on this domain ultimately derives from: Vite
      serves it directly for the main SPA (/), and vite-prerender-plugin
      reuses this exact file's compiled output as the starting template for
      every prerendered page (blog/wealth/legal - see
      generateBundle: `const tpl = bundle['index.html'].source`), so this
      one tag covers all of them without repeating it per file. The only
      page it does NOT cover is public/landing.html, a genuinely separate
      static file untouched by Vite's HTML pipeline - added there
      separately.
    -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1499277752378194" crossorigin="anonymous"></script>
    <link rel="icon" type="image/png" href="/assets/amanah-logo.png" />
    <link rel="apple-touch-icon" href="/assets/amanah-logo.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a2e1f" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>%VITE_APP_TITLE%</title>
    <meta name="description" content="%VITE_APP_DESCRIPTION%" />
    <meta name="author" content="AmanahLife" />

    <meta property="og:title" content="%VITE_APP_TITLE%" />
    <meta property="og:description" content="%VITE_APP_DESCRIPTION%" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://app.amanahlife.com" />
    <meta property="og:image" content="https://app.amanahlife.com/assets/amanah-logo.png" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="%VITE_APP_TITLE%" />
    <meta name="twitter:description" content="%VITE_APP_DESCRIPTION%" />
    <meta name="twitter:image" content="https://app.amanahlife.com/assets/amanah-logo.png" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "AmanahLife",
        "applicationCategory": "LifestyleApplication",
        "operatingSystem": "Web, Android",
        "description": "AmanahLife is a personal life planning and daily log app that helps individuals and families track prayer times, habits, finances, and personal growth in one place.",
        "url": "https://app.amanahlife.com",
        "offers": {
          "@type": "AggregateOffer",
          "priceCurrency": "USD",
          "lowPrice": "0",
          "highPrice": "12.99",
          "offerCount": "3"
        },
        "publisher": {
          "@type": "Organization",
          "name": "LinkoraNet LLC",
          "url": "https://app.amanahlife.com/about"
        }
      }
    </script>
    <style>
      [data-atoms-badge],[class*="atoms-badge"],[id*="atoms-badge"],[class*="AtomsBadge"],[id*="AtomsBadge"],a[href*="atoms.com"][style*="fixed"],div[style*="fixed"][style*="bottom"][style*="right"]>a[href*="atoms"],iframe[src*="atoms"],#atoms-watermark,.atoms-watermark{display:none!important;visibility:hidden!important;opacity:0!important;pointer-events:none!important}
    </style>
  </head>

  <body>
    <script src="/theme-init.js"></script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
